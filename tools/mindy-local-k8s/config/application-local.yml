# Local Kubernetes acceptance only. Does not use Aliyun RDS, SMS, or production keys.
server:
  address: 127.0.0.1
  port: 18080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ygy_ai?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: mindy
    password: mindy-local-app
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: redis
      port: 6379
  ai:
    dashscope:
      api-key: local-k8s-unused
      chat:
        options:
          model: qwen3.8-flash

app:
  database:
    ddl-auto: update
    show-sql: false
  ai:
    backup:
      model: qwen-plus
  scheduler:
    enabled: false
  jwt:
    secret: bG9jYWwtazhzLWp3dC1zaWduaW5nLXNlY3JldC0zMmNoYXJz
  email-auth:
    local-enabled: true
    secret: local-k8s-email-proof-secret-32ch
    mailbox-directory: /mailbox
    smtp:
      enabled: false
  apple-sign-in:
    login-enabled: false
    verifier-enabled: false
  sms-verification:
    code-secret: local-k8s-sms-code-secret-32chars
    fixed-code-enabled: false
    fixed-code-bypass-enabled: false

ai:
  history:
    cursor-secret: local-k8s-history-cursor-secret-32

aliyun:
  moderation:
    enabled: false
  bailian:
    api:
      key: local-k8s-unused
  oss:
    endpoint: http://seaweedfs:8333
    access-key: mindy-local
    secret-key: mindy-local-secret
    bucket-name: mindy-audio
    domain: seaweedfs:8333

apple:
  iap:
    enabled: false

realtime:
  companion-memory:
    enabled: false
  dashscope:
    api-key: local-k8s-unused
    ws-url: ws://192.168.5.2:18765/api-ws/v1/realtime
    model: local-k8s-deferred

mindy:
  content:
    english-enabled: true
    local-audio:
      base-url: https://wendydemacbook-air.local:8443
      bucket: mindy-local-english
      secret: ${LOCAL_AUDIO_SECRET:}

management:
  health:
    redis:
      enabled: true
