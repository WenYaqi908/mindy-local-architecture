apiVersion: v1
kind: Secret
metadata:
  name: mysql-auth
  namespace: mindy
stringData:
  MYSQL_ROOT_PASSWORD: mindy-local-root
  MYSQL_DATABASE: ygy_ai
  MYSQL_USER: mindy
  MYSQL_PASSWORD: mindy-local-app
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mindy
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mindy
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          envFrom:
            - secretRef:
                name: mysql-auth
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-umindy", "-pmindy-local-app"]
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
