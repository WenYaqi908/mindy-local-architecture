apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: mindy
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    server {
      listen 443 ssl;
      server_name _;
      ssl_certificate /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      client_max_body_size 8m;
      root /usr/share/nginx/html;
      location = /index.html {
        add_header Cache-Control "no-store";
      }
      location /local-listen/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri __LOCAL_AUDIO_SECRET__";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        proxy_pass http://seaweedfs:8333/mindy-audio/local-listen/;
        proxy_http_version 1.1;
        proxy_set_header Host seaweedfs:8333;
        proxy_set_header Range $http_range;
      }
      location / {
        try_files $uri /index.html;
      }
      location ~ ^/(api|member|vip|ws)(/|$) {
        proxy_pass http://engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: mindy
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: mindy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: mindy-web:local
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              secret=$(tr -d '\n' < /etc/local-audio/secret)
              sed "s#__LOCAL_AUDIO_SECRET__#${secret}#" /etc/nginx/templates-src/default.conf > /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 443
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates-src
              readOnly: true
            - name: local-audio
              mountPath: /etc/local-audio
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: local-audio
          secret:
            secretName: local-audio
        - name: conf
          emptyDir: {}
        - name: certs
          secret:
            secretName: mindy-tls
